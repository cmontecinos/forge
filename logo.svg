<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120">
  <defs>
    <linearGradient id="flame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="50%" style="stop-color:#fb923c"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
    <linearGradient id="anvil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6b7280"/>
      <stop offset="100%" style="stop-color:#374151"/>
    </linearGradient>
  </defs>

  <!-- Anvil body -->
  <path d="M16 78 L28 58 L68 58 L80 78 Z" fill="url(#anvil)"/>
  <rect x="22" y="48" width="52" height="12" rx="2" fill="#4b5563"/>
  <!-- Anvil horn -->
  <path d="M68 48 L92 52 L68 56 Z" fill="#4b5563"/>
  <!-- Anvil highlight -->
  <rect x="26" y="50" width="38" height="3" rx="1" fill="#6b7280" opacity="0.6"/>

  <!-- Hammer -->
  <rect x="40" y="14" width="4" height="34" rx="1" fill="#92400e" transform="rotate(-15 42 31)"/>
  <rect x="28" y="8" width="28" height="12" rx="3" fill="#78716c"/>
  <rect x="28" y="8" width="28" height="4" rx="2" fill="#a8a29e" opacity="0.4"/>

  <!-- Sparks -->
  <circle cx="52" cy="46" r="2" fill="#fbbf24" opacity="0.9"/>
  <circle cx="62" cy="40" r="1.5" fill="#fb923c" opacity="0.8"/>
  <circle cx="36" cy="42" r="1.5" fill="#fbbf24" opacity="0.7"/>
  <circle cx="70" cy="44" r="1" fill="#f97316" opacity="0.6"/>
  <circle cx="30" cy="38" r="1" fill="#fbbf24" opacity="0.5"/>

  <!-- "FORGE" text -->
  <text x="110" y="68" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="56" font-weight="800" letter-spacing="-1" fill="#111827">FORGE</text>

  <!-- Tagline -->
  <text x="112" y="88" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#6b7280" letter-spacing="3">SCAFFOLD &amp; SHIP</text>
</svg>
