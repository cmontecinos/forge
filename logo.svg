<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111827"/>
      <stop offset="100%" style="stop-color:#1f2937"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#eab308"/>
    </linearGradient>
    <linearGradient id="textglow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f9fafb"/>
      <stop offset="100%" style="stop-color:#d1d5db"/>
    </linearGradient>
  </defs>

  <!-- Background pill -->
  <rect x="0" y="0" width="520" height="100" rx="16" fill="url(#bg)"/>

  <!-- Subtle inner border -->
  <rect x="1.5" y="1.5" width="517" height="97" rx="15" fill="none" stroke="#374151" stroke-width="1"/>

  <!-- Accent bar left -->
  <rect x="0" y="0" width="6" height="100" rx="3" fill="url(#accent)"/>

  <!-- FORGE text -->
  <text x="48" y="58" font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', monospace" font-size="44" font-weight="800" letter-spacing="14" fill="url(#textglow)">FORGE</text>

  <!-- Lightning bolt -->
  <g transform="translate(370, 22)">
    <polygon points="22,0 8,26 18,26 10,48 36,18 24,18 32,0" fill="url(#accent)"/>
  </g>

  <!-- Tagline -->
  <text x="48" y="78" font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', monospace" font-size="11" font-weight="400" letter-spacing="4" fill="#6b7280">SCAFFOLD &amp; SHIP</text>
</svg>
